name: sauf_o_mat_display_app
description: "Sauf-O-Mat display app"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: 3.13.5

dependencies:
  flutter:
    sdk: flutter

  english_words: 4.0.0
  provider: ^6.1.5+1
  window_manager: ^0.5.2
  syncfusion_flutter_charts: ^35.1.39
  flutter_svg: ^2.3.0
  http: ^1.6.0
  jose: ^0.3.5+2
  flutter_dotenv: ^6.0.1
  flutter_webrtc: ^1.6.2+hotfix.4
  web_socket_channel: 3.0.3
  google_fonts: ^9.0.0
  intl: ^0.20.3
  flutter_tilt: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/billboard.png
    - assets/billboard_pink.png
    - assets/scroll.png
    - assets/parchment.png
    - assets/newspaper.png
    - assets/arrow_up.svg
    - assets/beer_foam.svg
    - assets/cowboy_chasing.gif
    - assets/placeholder_group.png
    - assets/placeholder_single.png
    - assets/placeholder_timetable.png
    - assets/timetable.png
    - assets/bottle_spin.gif
    - assets/kiss.gif
    - assets/rose_wreath.png
    - assets/prize_0.png
    - assets/prize_1.png
    - assets/prize_2.png
    - assets/bullet_hole_angled.png
    - assets/bullet_hole_angled_grey.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

